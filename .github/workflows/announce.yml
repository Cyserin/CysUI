name: Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Announcement
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          RELEASE_NAME="${{ github.event.release.name }}"
          BODY="${{ github.event.release.body }}"
          
          # Clean markdown quotes for JSON payload
          CLEAN_BODY=$(echo "$BODY" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')

          PAYLOAD=$(cat <<EOF
          {
            "username": "CysUI Updates",
            "avatar_url": "https://raw.githubusercontent.com/Cyserin/CysUI/main/Media/logo.png",
            "embeds": [{
              "title": "✨ CysUI ${TAG_NAME} Released!",
              "description": "${RELEASE_NAME}\\n\\n${CLEAN_BODY}",
              "color": 13081710,
              "fields": [
                {
                  "name": "🌐 Interactive Changelog",
                  "value": "[View Web Changelog & Features](https://Cyserin.github.io/CysUI/)",
                  "inline": false
                }
              ]
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"