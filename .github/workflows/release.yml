name: Release

# Every push to main checks the Version line in CysUI.toc.
# If that version has no GitHub release yet, this:
#   1. turns the matching What's New entry in Core.lua into release notes
#   2. tags the commit (v0.57.0-alpha while RELEASE_CHANNEL is alpha)
#   3. builds the zip and uploads it to CurseForge, Wago and a GitHub release (BigWigs packager)
#   4. posts the release to Discord with a link to the web changelog
# Pushes that keep the same version (README, screenshots, workflow edits) release nothing.
#
# RELEASE_CHANNEL: alpha / beta = only people who opted in get it; empty = normal release.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: alpha
      GH_TOKEN: ${{ github.token }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CysUI.toc
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' CysUI.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          tag="v$v"
          if [ -n "$RELEASE_CHANNEL" ]; then tag="$tag-$RELEASE_CHANNEL"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released - nothing to do. Raise the Version in CysUI.toc to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag"
          fi

      - name: Write release notes from Core.lua
        if: steps.ver.outputs.new == 'true'
        run: python3 .github/scripts/notes.py "${{ steps.ver.outputs.version }}"

      - name: Tag the commit
        if: steps.ver.outputs.new == 'true'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "Cys's UI $tag"
            git push origin "$tag"
          fi
          git checkout -q "$tag"

      - name: Build and upload (CurseForge, Wago, GitHub release)
        if: steps.ver.outputs.new == 'true'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ github.token }}
        with:
          args: -n "{package-name}-{project-version}:Cys's UI {project-version}"

      - name: Post to Discord
        if: steps.ver.outputs.new == 'true' && env.DISCORD_WEBHOOK != ''
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          url="https://github.com/${{ github.repository }}/releases/tag/$tag"
          jq -n \
            --arg title "✨ Cys's UI $tag released" \
            --arg url "$url" \
            --rawfile desc discord.md \
            '{
              username: "CysUI Updates",
              avatar_url: "https://cyserin.github.io/CysUI/assets/preview.png",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 13081710,
                fields: [{
                  name: "🌐 Interactive Changelog",
                  value: "[View Web Changelog & Features](https://cyserin.github.io/CysUI/)",
                  inline: false
                }]
              }]
            }' | curl -sS --fail -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
