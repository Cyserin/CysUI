name: Release

# How a release happens:
#   1. You push to main. If the Version in CysUI.toc has no GitHub release yet, the "check" job tags
#      the commit (v0.58.0-alpha while RELEASE_CHANNEL is alpha) and starts this workflow again on
#      that tag. (GitHub lets a workflow start another run this way; a plain tag push from a workflow
#      would be ignored.)
#   2. The run on the tag ("release" job) writes the notes from the What's New entry in Core.lua,
#      builds the zip, uploads it to CurseForge, Wago and a GitHub release, and posts to Discord.
# Pushes that keep the same version (README, screenshots, workflow edits) release nothing.
# To redo a release by hand: Actions > Release > Run workflow > Tags > pick the tag.
#
# RELEASE_CHANNEL: alpha / beta = only people who opted in get it; empty = normal release.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  RELEASE_CHANNEL: alpha

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag a new version and start its release
        run: |
          v=$(grep -m1 '^## Version:' CysUI.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          tag="v$v"
          if [ -n "$RELEASE_CHANNEL" ]; then tag="$tag-$RELEASE_CHANNEL"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released - nothing to do. Raise the Version in CysUI.toc to release."
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Cys's UI $tag"
            git push origin "$tag"
          fi
          gh workflow run release.yml --ref "$tag"
          echo "Started the release run for $tag"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from CysUI.toc
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' CysUI.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Write release notes from Core.lua
        run: python3 .github/scripts/notes.py "${{ steps.ver.outputs.version }}"

      - name: Build and upload (CurseForge, Wago, GitHub release)
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ github.token }}
        with:
          args: -n "{package-name}-{project-version}:Cys's UI {project-version}"

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK != ''
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          url="https://github.com/${{ github.repository }}/releases/tag/$tag"
          jq -n \
            --arg title "✨ Cys's UI $tag released" \
            --arg url "$url" \
            --rawfile desc discord.md \
            '{
              username: "CysUI Updates",
              avatar_url: "https://cyserin.github.io/CysUI/assets/preview.png",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 13081710,
                fields: [{
                  name: "🌐 Full notes",
                  value: "[Interactive changelog & features](https://cyserin.github.io/CysUI/)",
                  inline: false
                }]
              }]
            }' | curl -sS --fail -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
