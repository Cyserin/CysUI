name: Release

# Every time you push to main, this checks the version in CysUI.toc.
# If that version has no release yet, it zips the addon and publishes it as an alpha release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CysUI.toc
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' CysUI.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p build/CysUI
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='.gitattributes' --exclude='.pkgmeta' \
            --exclude='Screenshots' --exclude='build' \
            ./ build/CysUI/
          (cd build && zip -rq "../CysUI-v$v.zip" CysUI)
          ls -l "CysUI-v$v.zip"

      - name: Publish the release
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          cat > notes.md <<'EOF'
          Alpha test build. Download the file named **CysUI-v...zip** below (not "Source code").

          Unzip it so the folder is named exactly `CysUI` and sits in
          `World of Warcraft\_classic_era_\Interface\AddOns\`, then type `/cui` in game.

          What changed is in the game: `/cui` -> What's New.
          Bugs and ideas: use the Issues tab.
          EOF
          gh release create "v$v" "CysUI-v$v.zip" \
            --target "$GITHUB_SHA" \
            --title "Cys's UI v$v (alpha)" \
            --prerelease \
            --notes-file notes.md
