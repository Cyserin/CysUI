name: Release

# Every time you push to main, this checks the version in CysUI.toc.
# If that version has no release yet, it zips the addon, publishes it on GitHub, and (once the
# CF_API_KEY / WAGO_API_TOKEN secrets and the project IDs in the toc exist) uploads it to
# CurseForge and Wago too.
#
# RELEASE_CHANNEL decides what the sites call the build:
#   alpha  -> only people who opted in to alpha builds get it (use while testing)
#   beta   -> same for beta
#   (empty) -> a normal release that everyone gets
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CHANNEL: alpha
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CysUI.toc
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' CysUI.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          tag="v$v"
          if [ -n "$RELEASE_CHANNEL" ]; then tag="$tag-$RELEASE_CHANNEL"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p build/CysUI
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='.gitattributes' --exclude='.pkgmeta' \
            --exclude='Screenshots' --exclude='build' \
            ./ build/CysUI/
          (cd build && zip -rq "../CysUI-v$v.zip" CysUI)
          ls -l "CysUI-v$v.zip"

      - name: Publish the release
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          label="${RELEASE_CHANNEL:-release}"
          cat > notes.md <<'NOTES'
          Test build. Download the file named **CysUI-v...zip** below (not "Source code").

          Unzip it so the folder is named exactly `CysUI` and sits in
          `World of Warcraft\_classic_era_\Interface\AddOns\`, then type `/cui` in game.

          What changed is in the game: `/cui` -> What's New.
          Bugs and ideas: use the Issues tab.
          NOTES
          gh release create "$tag" "CysUI-v$v.zip" \
            --target "$GITHUB_SHA" \
            --title "Cys's UI v$v ($label)" \
            --latest \
            --notes-file notes.md

      # CurseForge and Wago. Skipped until at least one of the two secrets is saved in the repo.
      # (The packager reads the project IDs from the toc and CHANGELOG.md from the repo.)
      # It must NOT see the new git tag: on a branch push it stops with "Found future tag" if a tag
      # points at the commit. So the tag is not fetched, the build counts as an alpha, and the
      # file name and label are set here from the version in the toc.
      # (To publish beta or normal releases later, this step has to change; ask before switching.)
      - name: Upload to CurseForge and Wago
        if: steps.ver.outputs.exists == 'false' && (env.CF_API_KEY != '' || env.WAGO_API_TOKEN != '')
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-v${{ steps.ver.outputs.version }}{alpha}:v${{ steps.ver.outputs.version }}{alpha}"
